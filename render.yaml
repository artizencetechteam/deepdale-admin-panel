services:
  - type: web
    name: deepdale-backend
    runtime: node
    buildCommand: pnpm install --no-frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deepdale
          property: connectionString
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: UPLOAD_DRIVER
        value: local # Consider S3 for production persistent storage
      - key: UPLOAD_DIR
        value: uploads
      - key: SESSION_TTL_HOURS
        value: 168
      - key: APP_BASE_URL
        fromContext: instance_url
    plan: free # Change if needed
    disk:
      name: uploads-disk
      mountPath: /opt/render/project/src/uploads # Ensure this persists
      sizeGB: 1
