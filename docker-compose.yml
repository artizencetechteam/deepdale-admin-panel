services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://deepdale:deepdale@db:5432/deepdale
      NODE_ENV: production
    ports:
      - "4160:4000"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - app_net
      - db_net


  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deepdale
      POSTGRES_USER: deepdale
      POSTGRES_PASSWORD: deepdale
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepdale -d deepdale"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db_net

volumes:
  db-data:
  uploads-data:

networks:
  app_net:
  db_net:
    internal: true
