[build]
  command = "pnpm install && pnpm build:admin"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

[[redirects]]
  from = "/api/*"
  to = "https://deepdale-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://deepdale-backend.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://deepdale-backend.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.json"
  to = "https://deepdale-backend.onrender.com/openapi.json"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
